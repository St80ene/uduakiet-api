

services:
  api:
    build: .
    container_name: uduakiet-api-prod
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5000}
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: uduakiet-db-prod
    restart: always
    environment:
      # Use variables from your .env file here
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: